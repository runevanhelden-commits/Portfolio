<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 140" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHex_techHexagon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04354a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="85,18 135,46 135,102 85,130 35,102 35,46" fill="none" stroke="url(#gradHex_techHexagon)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner Tech Circuit Lines -->
