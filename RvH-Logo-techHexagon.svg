  <polyline points="135,102 110,88 110,60 85,46" fill="none" stroke="#04354a" stroke-width="2" opacity="0.6"/>

  <!-- Center Text -->
  <text x="85" y="82" font-family="Inter, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    RvH
  </text>

  <!-- Circuit Nodes -->
  <circle cx="85" cy="18" r="4" fill="#04354a"/>
  <circle cx="135" cy="46" r="4" fill="#ffffff"/>
  <circle cx="35" cy="102" r="4" fill="#000000"/>
  
  
</svg>